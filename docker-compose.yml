version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testyourself_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - pdf_uploads:/app/uploads
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testyourself_bot
    command: python -m src.bot.main
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - pdf_uploads:/app/uploads
      - app_logs:/app/logs
    restart: unless-stopped

volumes:
  pdf_uploads:
    name: testyourself_pdf_uploads
  app_logs:
    name: testyourself_app_logs
